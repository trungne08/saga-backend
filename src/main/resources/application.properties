spring.config.import=optional:file:.env[.properties]
spring.application.name=be
server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Gọi biến từ file .env
spring.datasource.url=${AIVEN_JDBC_URL}
spring.datasource.username=${AIVEN_DB_USERNAME}
spring.datasource.password=${AIVEN_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Base configuration only validates the schema; local profile enables updates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Controllers currently return JPA entities, so keep the persistence context open for serialization.
spring.jpa.open-in-view=true

spring.mongodb.uri=${MONGO_URI}
spring.mongodb.database=saga_db
