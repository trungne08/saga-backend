spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]
spring.application.name=be
server.port=${PORT:8080}
server.forward-headers-strategy=framework
app.public-base-url=${PUBLIC_BASE_URL}
app.integration.callback-redirect-uri=${INTEGRATION_CALLBACK_REDIRECT_URI}
app.integration.callback-result-ttl=${INTEGRATION_CALLBACK_RESULT_TTL:PT5M}
app.privacy.contact-url=${PRIVACY_CONTACT_URL:}
app.cors.allowed-origins=${FRONTEND_ORIGINS}
app.auth.success-redirect-uri=${AUTH_SUCCESS_REDIRECT_URI}
app.auth.logout-redirect-uri=${AUTH_LOGOUT_REDIRECT_URI:${AUTH_SUCCESS_REDIRECT_URI}}
app.auth.cognito-domain=${COGNITO_DOMAIN:}
app.student-invitation.login-url=${STUDENT_INVITATION_LOGIN_URL:${PUBLIC_BASE_URL}/api/auth/login}
app.student-invitation.retry-delay-ms=${STUDENT_INVITATION_RETRY_DELAY_MS:60000}
app.student-invitation.processing-timeout-ms=${STUDENT_INVITATION_PROCESSING_TIMEOUT_MS:300000}

# Gmail SMTP invitation delivery. Empty credentials keep the adapter unavailable
# without preventing application startup or attempting a provider connection.
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# User notification delivery. Firebase credentials are optional and provider
# unavailability must not prevent notification DB/API startup.
app.notification.delivery.processing-enabled=${NOTIFICATION_DELIVERY_PROCESSING_ENABLED:true}
app.notification.delivery.retry-delay-ms=${NOTIFICATION_DELIVERY_RETRY_DELAY_MS:60000}
app.notification.delivery.processing-timeout-ms=${NOTIFICATION_DELIVERY_PROCESSING_TIMEOUT_MS:300000}
app.notification.deadline.processing-enabled=${NOTIFICATION_DEADLINE_PROCESSING_ENABLED:true}
app.notification.deadline.scan-delay-ms=${NOTIFICATION_DEADLINE_SCAN_DELAY_MS:3600000}

# Spring Boot is the confidential OAuth2/OIDC client. Google credentials belong only in Cognito.
spring.security.oauth2.client.registration.cognito.provider=cognito
spring.security.oauth2.client.registration.cognito.client-id=${COGNITO_CLIENT_ID}
spring.security.oauth2.client.registration.cognito.client-secret=${COGNITO_CLIENT_SECRET}
spring.security.oauth2.client.registration.cognito.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.cognito.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.cognito.scope=openid,email,profile
spring.security.oauth2.client.registration.cognito.client-name=Amazon Cognito
spring.security.oauth2.client.provider.cognito.issuer-uri=${COGNITO_ISSUER_URI}
spring.security.oauth2.client.provider.cognito.user-name-attribute=sub

server.servlet.session.cookie.http-only=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Spring Boot 4.1's Mongo contributor runs `hello` against the `local` database.
# Atlas application users need not, and must not, receive permissions on `local`.
management.health.mongodb.enabled=false

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:${SWAGGER_ENABLED:false}}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:${SWAGGER_ENABLED:false}}
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN

# Gọi biến từ file .env
spring.datasource.url=${DATABASE_JDBC_URL:${AIVEN_JDBC_URL}}
spring.datasource.username=${DATABASE_USERNAME:${AIVEN_DB_USERNAME}}
spring.datasource.password=${DATABASE_PASSWORD:${AIVEN_DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate validates the Flyway-managed schema and never mutates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Controllers currently return JPA entities, so keep the persistence context open for serialization.
spring.jpa.open-in-view=true
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

spring.mongodb.uri=${MONGO_URI}
spring.mongodb.database=${MONGO_DATABASE}
app.mongodb.health.timeout=${MONGO_HEALTH_TIMEOUT:PT5S}

# Jira Cloud OAuth 2.0 (3LO) and dynamic webhooks.
app.integrations.jira.enabled=${JIRA_INTEGRATION_ENABLED:true}
app.integrations.jira.client-id=${JIRA_CLIENT_ID:}
app.integrations.jira.client-secret=${JIRA_CLIENT_SECRET:}
app.integrations.jira.authorization-url=${JIRA_AUTHORIZATION_URL:}
app.integrations.jira.token-url=${JIRA_TOKEN_URL:}
app.integrations.jira.api-base-url=${JIRA_API_BASE_URL:}
app.integrations.jira.callback-url=${JIRA_CALLBACK_URL}
app.integrations.jira.webhook-public-url=${JIRA_WEBHOOK_PUBLIC_URL:}
app.integrations.jira.scopes=${JIRA_SCOPES:read:jira-work write:jira-work manage:jira-webhook offline_access read:board-scope:jira-software read:board-scope.admin:jira-software read:project:jira read:sprint:jira-software write:sprint:jira-software delete:sprint:jira-software write:board-scope:jira-software write:issue:jira-software}
saga.integration.jira.time-zone=${JIRA_TIME_ZONE:UTC}

# GitHub App user authorization and installation APIs.
app.integrations.github.enabled=${GITHUB_INTEGRATION_ENABLED:true}
app.integrations.github.app-id=${GITHUB_APP_ID:}
app.integrations.github.client-id=${GITHUB_CLIENT_ID:}
app.integrations.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.integrations.github.private-key=${GITHUB_PRIVATE_KEY:}
app.integrations.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
app.integrations.github.app-slug=${GITHUB_APP_SLUG:}
app.integrations.github.setup-url=${GITHUB_SETUP_URL}
app.integrations.github.api-base-url=${GITHUB_API_BASE_URL:}
app.integrations.github.web-base-url=${GITHUB_WEB_BASE_URL:}
app.integrations.github.personal-callback-url=${GITHUB_PERSONAL_CALLBACK_URL}
app.integrations.github.project-callback-url=${GITHUB_PROJECT_CALLBACK_URL}
app.integrations.github.webhook-public-url=${GITHUB_WEBHOOK_PUBLIC_URL:}
app.integrations.local-webhook-base-url=${LOCAL_WEBHOOK_BASE_URL:}

app.integrations.token-encryption-key=${INTEGRATION_TOKEN_ENCRYPTION_KEY:}
app.integrations.token-encryption-key-id=${INTEGRATION_TOKEN_ENCRYPTION_KEY_ID:primary}
app.integrations.token-encryption-previous-keys=${INTEGRATION_TOKEN_ENCRYPTION_PREVIOUS_KEYS:}
app.integrations.oauth-state-ttl=${INTEGRATION_OAUTH_STATE_TTL:PT10M}
app.integrations.http-connect-timeout=${INTEGRATION_HTTP_CONNECT_TIMEOUT:PT3S}
app.integrations.http-read-timeout=${INTEGRATION_HTTP_READ_TIMEOUT:PT10S}
app.integrations.reconciliation-enabled=${INTEGRATION_RECONCILIATION_ENABLED:true}
app.integrations.reconciliation-delay-ms=${INTEGRATION_RECONCILIATION_DELAY_MS:900000}
app.integrations.overlap-window=${INTEGRATION_OVERLAP_WINDOW:PT5M}
app.integrations.sync-job-stale-after=${SYNC_JOB_STALE_AFTER:PT15M}
app.integrations.stale-sync-job-recovery-delay-ms=${STALE_SYNC_JOB_RECOVERY_DELAY_MS:60000}
