# All environments use managed migrations; Hibernate never mutates the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# OAuth callbacks remain local. Provider webhooks are derived only when an
# HTTPS tunnel is supplied through LOCAL_WEBHOOK_BASE_URL.
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.integrations.jira.callback-url=${JIRA_CALLBACK_URL:${PUBLIC_BASE_URL:http://localhost:8080}/api/integrations/jira/callback}
app.integrations.github.personal-callback-url=${GITHUB_PERSONAL_CALLBACK_URL:${PUBLIC_BASE_URL:http://localhost:8080}/api/me/integrations/github/callback}
app.integrations.github.project-callback-url=${GITHUB_PROJECT_CALLBACK_URL:${PUBLIC_BASE_URL:http://localhost:8080}/api/integrations/github/project/callback}
app.integrations.github.setup-url=${GITHUB_SETUP_URL:${PUBLIC_BASE_URL:http://localhost:8080}/api/integrations/github/setup}
app.integrations.local-webhook-base-url=${LOCAL_WEBHOOK_BASE_URL:}

# Safe local defaults: no provider client is created and no provider job runs.
app.integrations.jira.enabled=${JIRA_INTEGRATION_ENABLED:false}
app.integrations.github.enabled=${GITHUB_INTEGRATION_ENABLED:false}
app.integrations.reconciliation-enabled=${INTEGRATION_RECONCILIATION_ENABLED:false}

# Disabled by default. It creates/reuses only explicitly marked local demo data.
app.local-demo-seed.enabled=${LOCAL_DEMO_SEED_ENABLED:false}
app.local-demo-seed.leader-cognito-sub=${LOCAL_DEMO_LEADER_COGNITO_SUB:}

server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Create empty Mongo collections without inserting test documents.
app.mongodb.initialize-collections=true
