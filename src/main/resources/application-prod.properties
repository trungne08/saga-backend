spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:${SWAGGER_ENABLED:false}}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:${SWAGGER_ENABLED:false}}
