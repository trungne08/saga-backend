<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SAGA Backend production API service">
  <title>SAGA Backend</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #08111f;
      color: #e6edf7;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      background: radial-gradient(circle at 20% 15%, #143459 0, transparent 35%), #08111f;
    }

    main {
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .card {
      width: min(100%, 38rem);
      padding: clamp(2rem, 5vw, 3.5rem);
      border: 1px solid rgba(158, 193, 238, .22);
      border-radius: 1.25rem;
      background: rgba(14, 29, 49, .88);
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .32);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 .75rem;
      color: #7dd3fc;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.25rem); }

    .description { margin: 1rem auto; color: #c8d6e8; font-size: 1.1rem; line-height: 1.6; }

    .environment {
      display: inline-block;
      margin: .5rem 0 1.75rem;
      padding: .4rem .75rem;
      border-radius: 999px;
      background: rgba(34, 197, 94, .14);
      color: #a7f3d0;
      font-size: .9rem;
    }

    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.8rem;
      padding: .65rem 1rem;
      border-radius: .65rem;
      font-weight: 700;
      text-decoration: none;
    }

    .primary { background: #38bdf8; color: #082032; }
    .primary:hover, .primary:focus-visible { background: #7dd3fc; }
    .secondary { border: 1px solid #426383; color: #dcecff; }
    .secondary:hover, .secondary:focus-visible { border-color: #7dd3fc; background: rgba(125, 211, 252, .1); }

    footer { padding: 1.5rem; color: #8fa7c2; font-size: .85rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">Production API environment</p>
      <h1 id="page-title">SAGA Backend</h1>
      <p class="description">Backend service is running successfully.</p>
      <p class="environment">Production environment</p>
      <nav class="actions" aria-label="Service links">
        <a class="primary" href="/swagger-ui/index.html">Open Swagger UI</a>
        <a class="secondary" href="/actuator/health">Health Check</a>
      </nav>
    </section>
  </main>
  <footer>SAGA – Student Agile Governance and Analytics</footer>
</body>
</html>
