spring.datasource.url=jdbc:h2:mem:saga;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=CLASS,COMMENT
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
PUBLIC_BASE_URL=https://saga.test
INTEGRATION_CALLBACK_REDIRECT_URI=https://frontend.test/integrations/callback
INTEGRATION_CALLBACK_RESULT_TTL=PT5M
STUDENT_INVITATION_LOGIN_URL=https://saga.test/api/auth/login
app.student-invitation.processing-enabled=false
app.notification.delivery.processing-enabled=false
JIRA_CALLBACK_URL=https://saga.test/api/integrations/jira/callback
JIRA_WEBHOOK_PUBLIC_URL=https://saga.test/api/webhooks/jira
GITHUB_PERSONAL_CALLBACK_URL=https://saga.test/api/me/integrations/github/callback
GITHUB_PROJECT_CALLBACK_URL=https://saga.test/api/integrations/github/project/callback
GITHUB_SETUP_URL=https://saga.test/api/integrations/github/setup
GITHUB_WEBHOOK_PUBLIC_URL=https://saga.test/api/webhooks/github
JIRA_INTEGRATION_ENABLED=false
GITHUB_INTEGRATION_ENABLED=false

# MongoDB is not contacted by the context smoke test.
spring.mongodb.uri=mongodb://localhost:27017/test
spring.mongodb.database=test
app.mongodb.initialize-collections=false
# Unit and MVC tests must never contact the configured MongoDB URI.
app.mongodb.health.enabled=false

# Avoid external issuer discovery in tests while retaining a real client registration.
spring.security.oauth2.client.registration.cognito.provider=cognito
spring.security.oauth2.client.registration.cognito.client-id=test-client
spring.security.oauth2.client.registration.cognito.client-secret=test-secret
spring.security.oauth2.client.registration.cognito.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.cognito.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.cognito.scope=openid,email,profile
spring.security.oauth2.client.registration.cognito.client-name=Amazon Cognito
spring.security.oauth2.client.provider.cognito.authorization-uri=https://cognito.test/oauth2/authorize
spring.security.oauth2.client.provider.cognito.token-uri=https://cognito.test/oauth2/token
spring.security.oauth2.client.provider.cognito.jwk-set-uri=https://cognito.test/.well-known/jwks.json
spring.security.oauth2.client.provider.cognito.user-info-uri=https://cognito.test/oauth2/userInfo
spring.security.oauth2.client.provider.cognito.user-name-attribute=sub

app.auth.success-redirect-uri=http://localhost:8080/api/auth/me
app.auth.logout-redirect-uri=http://localhost:3000/logout/callback
app.cors.allowed-origins=http://localhost:3000
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.integrations.reconciliation-enabled=false
