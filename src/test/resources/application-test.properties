spring.datasource.url=jdbc:h2:mem:saga;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=CLASS,COMMENT
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# MongoDB is not contacted by the context smoke test.
spring.mongodb.uri=mongodb://localhost:27017/test
spring.mongodb.database=test
app.mongodb.initialize-collections=false
